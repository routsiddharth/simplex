[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplex-ingest"
version = "0.1.0"
description = "Simplex stage 1 ingest subsystem (Kalshi)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "websockets>=13.0",
    "httpx>=0.27",
    "cryptography>=43.0",
    "certifi>=2024.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "sortedcontainers>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "pytest-mock>=3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Bundle the DDL file with the package so db.py can read it at runtime.
[tool.setuptools.package-data]
simplex_ingest = ["schema.sql"]
